services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: delivery
      POSTGRES_PASSWORD: delivery_pass
      POSTGRES_DB: delivery_db
    volumes:
      - ./schemas/postgresql/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./data.sql:/docker-entrypoint-initdb.d/02_data.sql
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U delivery -d delivery_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    environment:
      DB_CONNECTION: "postgresql://delivery:delivery_pass@postgres:5432/delivery_db"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  swagger-ui:
    image: swaggerapi/swagger-ui
    environment:
      SWAGGER_JSON: /openapi/openapi.yaml
    volumes:
      - ./openapi.yaml:/openapi/openapi.yaml:ro
    ports:
      - "8081:8080"

volumes:
  pg_data:
